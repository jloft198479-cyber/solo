[package]
name = "solo"
version = "1.2.66"
description = "solo - A lightweight Markdown editor"
authors = ["luoxiaodou"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "solo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-cli = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "system-proxy"] }
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
url = "2"
tauri-plugin-store = "2.4.3"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2.4.1"
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
webview2-com = "0.38.2"
windows-core = "0.61"
# 版本与 tauri / tao 对齐（0.61）；用于原生边缘缩放 WM_NCHITTEST 子类化，见 native_resize.rs
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
